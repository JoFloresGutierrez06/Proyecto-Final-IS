# Configuración de SonarQube (análisis estático de calidad)
# Documentación del proceso y métricas: docs/calidad-y-seguridad/
sonar.projectKey=gestion-donaciones-mvp
sonar.projectName=Gestión de Donaciones MVP
sonar.sources=src,public/js
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/docs/**
sonar.sourceEncoding=UTF-8
# Importa la cobertura de Jest (npm run test:coverage genera coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
