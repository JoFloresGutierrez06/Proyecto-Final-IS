name: CI - Pruebas y cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Instalar, probar y verificar cobertura
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      # Jest falla automáticamente (exit code != 0) si la cobertura
      # global baja del umbral de 80% definido en jest.config.js
      - name: Subir reporte de cobertura (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  deploy:
    name: Desplegar en Render (entorno de prueba)
    runs-on: ubuntu-latest
    needs: test
    # Solo en push a main (no en PR) y solo si las pruebas pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Disparar deploy hook de Render
        # La URL vive en GitHub → Settings → Secrets and variables → Actions
        # como secreto RENDER_DEPLOY_HOOK_URL; nunca en el código.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL no está configurado; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
